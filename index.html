<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PainMap | Mixed-evidence atlas of pain sources by place</title>
    <meta name="description" content="PainMap is a place-first atlas for direct evidence, modeled estimates, proxy aggregates, and priority overlays about pain sources.">
    <link rel="canonical" href="https://painmap.org/">
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; background: #f8faf9; color: #17363c; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 2rem; box-sizing: border-box; }
      .loading { width: min(34rem, 100%); border: 1px solid #cbd7d5; background: #fff; padding: 1.5rem; }
      h1 { margin: 0 0 .5rem; font-size: 1.35rem; }
      p { margin: 0; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <section class="loading" aria-live="polite">
        <h1>Loading PainMap</h1>
        <p id="bootstrap-status">Preparing the country boundary layer…</p>
      </section>
    </main>
    <noscript>
      <p><a href="/app.html">Open PainMap</a>. JavaScript is required for the interactive atlas.</p>
    </noscript>
    <script>
      (() => {
        fetch("/app.html?v=20260713-map-timeout-fix-3", { cache: "no-store" })
          .then((response) => {
            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }
            return response.text();
          })
          .then((html) => {
            const parsed = new DOMParser().parseFromString(html, "text/html");
            const atlasModule = parsed.querySelector('script[type="module"][src^="script.js"]');

            if (!atlasModule) {
              throw new Error("atlas module was not found");
            }

            atlasModule.src = "/map-bootstrap.js?v=20260713-3";
            atlasModule.removeAttribute("integrity");
            atlasModule.removeAttribute("crossorigin");

            const patchedHtml = `<!doctype html>\n${parsed.documentElement.outerHTML}`;
            document.open();
            document.write(patchedHtml);
            document.close();
          })
          .catch((error) => {
            const status = document.getElementById("bootstrap-status");
            if (status) {
              status.textContent = `PainMap failed to start: ${error.message}. Reload the page to retry.`;
            }
          });
      })();
    </script>
  </body>
</html>
