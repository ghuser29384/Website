<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PainMap | Mixed-evidence atlas of pain sources by place</title>
    <meta name="description" content="PainMap is a place-first atlas for direct evidence, modeled estimates, proxy aggregates, and priority overlays about pain sources.">
    <link rel="canonical" href="https://painmap.org/">
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; background: #f8faf9; color: #17363c; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 2rem; box-sizing: border-box; }
      .loading { width: min(34rem, 100%); border: 1px solid #cbd7d5; background: #fff; padding: 1.5rem; }
      h1 { margin: 0 0 .5rem; font-size: 1.35rem; }
      p { margin: 0; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <section class="loading" aria-live="polite">
        <h1>Loading PainMap</h1>
        <p id="bootstrap-status">Preparing the country boundary layer…</p>
      </section>
    </main>
    <noscript>
      <p><a href="/app.html">Open PainMap</a>. JavaScript is required for the interactive atlas.</p>
    </noscript>
    <script>
      (() => {
        const nativeFetch = window.fetch.bind(window);
        const boundaryPaths = new Set([
          "/data/natural-earth-countries.geojson",
          "/data/countries-lite.geojson",
        ]);

        window.fetch = (input, init = {}) => {
          let url;

          try {
            const rawUrl = typeof input === "string" || input instanceof URL ? input : input && input.url;
            url = new URL(rawUrl, window.location.href);
          } catch (_error) {
            return nativeFetch(input, init);
          }

          if (url.origin !== window.location.origin || !boundaryPaths.has(url.pathname)) {
            return nativeFetch(input, init);
          }

          const controller = new AbortController();
          const timeout = window.setTimeout(() => controller.abort(), 30000);
          const boundaryInit = Object.assign({}, init, { signal: controller.signal });

          return nativeFetch(input, boundaryInit).finally(() => {
            window.clearTimeout(timeout);
          });
        };

        nativeFetch("/app.html?v=20260713-map-timeout-fix", { cache: "no-store" })
          .then((response) => {
            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }
            return response.text();
          })
          .then((html) => {
            document.open();
            document.write(html);
            document.close();
          })
          .catch((error) => {
            const status = document.getElementById("bootstrap-status");
            if (status) {
              status.textContent = `PainMap failed to start: ${error.message}. Reload the page to retry.`;
            }
          });
      })();
    </script>
  </body>
</html>
