name: PainMap production Pages deploy

on:
  issues:
    types:
      - opened
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.title == '[PainMap Deploy] Publish current main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate production data payload
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 - <<'PY'
          import json
          from pathlib import Path

          context = json.loads(Path('data/pain-driver-context.json').read_text(encoding='utf-8'))
          summary = json.loads(Path('data/candidates/country-data-expansion/source-backed-country-summary.json').read_text(encoding='utf-8'))
          index = json.loads(Path('data/pain-drivers.json').read_text(encoding='utf-8'))

          assert context['dataset_id'] == 'painmap-human-mortality-context-v1'
          assert context['canonical_release'] is False
          assert len(context['observations']) == 741
          assert len(context['place_summaries']) == 191
          assert context['coverage']['indicator_count'] == 4
          assert context['coverage']['countries_with_all_indicators'] == 183
          assert summary['measurement_count'] == 24
          assert summary['country_count'] == 8
          assert summary['promoted_to_canonical'] == 0
          assert index['comparison_policy']['overall_cross_domain_ranking_enabled'] is False
          assert Path('data/pain-drivers/index.html').is_file()
          assert Path('data/pain-driver-context.csv').is_file()
          assert Path('schemas/pain-driver-context.schema.json').is_file()
          print('Validated 741 human context observations and 24 source-backed candidate observations.')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site with Jekyll Pages image
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful issue-triggered deployment
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            const body = [
              'Production deployment completed successfully.',
              '',
              `- Revision: \`${context.sha}\``,
              `- GitHub Pages URL: ${process.env.PAGE_URL}`,
              '- Validated: 741 human mortality-context observations',
              '- Validated: 24 source-backed cross-domain candidate observations',
              '- Canonical promotions: 0',
              '',
              'Verified production endpoints:',
              '- https://painmaps.org/data/pain-drivers/',
              '- https://painmaps.org/data/pain-driver-context.json',
              '- https://painmaps.org/data/pain-driver-context.csv',
              '- https://painmaps.org/data/pain-driver-deployment.json'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
