name: PainMap production Pages deploy

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.title == '[PainMap Deploy] Publish current main via Pages' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deployed_sha: ${{ steps.validation.outputs.sha }}
    steps:
      - name: Check out current production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate production data payload
        id: validation
        shell: bash
        run: |
          set -euo pipefail
          deployed_sha="$(git rev-parse HEAD)"
          echo "sha=$deployed_sha" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json
          from pathlib import Path

          context = json.loads(Path('data/pain-driver-context.json').read_text(encoding='utf-8'))
          summary = json.loads(Path('data/candidates/country-data-expansion/source-backed-country-summary.json').read_text(encoding='utf-8'))
          index = json.loads(Path('data/pain-drivers.json').read_text(encoding='utf-8'))

          assert context['dataset_id'] == 'painmap-human-mortality-context-v1'
          assert context['canonical_release'] is False
          assert len(context['observations']) == 741
          assert len(context['place_summaries']) == 191
          assert context['coverage']['indicator_count'] == 4
          assert context['coverage']['countries_with_all_indicators'] == 183
          assert summary['measurement_count'] == 24
          assert summary['country_count'] == 8
          assert summary['promoted_to_canonical'] == 0
          assert index['comparison_policy']['overall_cross_domain_ranking_enabled'] is False
          assert Path('data/pain-drivers/index.html').is_file()
          assert Path('data/pain-driver-context.csv').is_file()
          assert Path('schemas/pain-driver-context.schema.json').is_file()
          print('Validated 741 human context observations and 24 source-backed candidate observations.')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site with Jekyll Pages image
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    if: always() && github.event_name == 'pull_request_target'
    needs:
      - build
      - deploy
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Report production deployment result
        uses: actions/github-script@v7
        with:
          script: |
            const buildResult = '${{ needs.build.result }}';
            const deployResult = '${{ needs.deploy.result }}';
            const deployedSha = '${{ needs.build.outputs.deployed_sha }}';
            const pageUrl = '${{ needs.deploy.outputs.page_url }}';
            const body = [
              '## PainMap production deployment',
              '',
              `- Build and data validation: **${buildResult}**`,
              `- Pages deployment: **${deployResult}**`,
              `- Deployed main SHA: \`${deployedSha || 'unknown'}\``,
              `- Page URL: ${pageUrl || 'not available'}`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
