name: PainMap live brand smoke

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "index.html"
      - "brand.css"
      - "assets/brand/**"
      - "scripts/apply-brand-system.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-brand-smoke:
    name: Verify deployed Evidence Field brand
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wait for and verify the live brand
        shell: bash
        run: |
          set -u

          fetch_live() {
            local label="$1"
            local url="$2"
            local output="$3"
            local code
            code=$(curl -sS -L --compressed --max-time 30 \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36' \
              -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
              -H 'Cache-Control: no-cache' \
              -o "$output" -w '%{http_code}' "$url" || true)
            echo "$label HTTP $code"
            test "$code" = "200"
          }

          for attempt in $(seq 1 8); do
            echo "Live brand check attempt ${attempt}/8"
            root_ok=false
            css_ok=false
            symbol_ok=false

            if fetch_live "homepage" "https://painmap.org/" /tmp/painmap-live.html; then
              if grep -q 'data-brand="evidence-field-v1"' /tmp/painmap-live.html \
                && grep -q 'Map pain.' /tmp/painmap-live.html \
                && grep -q 'Keep uncertainty visible.' /tmp/painmap-live.html; then
                root_ok=true
              else
                echo "homepage markers not present"
              fi
            fi

            if fetch_live "brand.css" "https://painmap.org/brand.css" /tmp/painmap-brand.css; then
              if grep -q -- '--pm-cobalt:#3154d8' /tmp/painmap-brand.css; then
                css_ok=true
              else
                echo "brand.css token not present"
              fi
            fi

            if fetch_live "brand symbol" "https://painmap.org/assets/brand/painmap-symbol-primary.svg" /tmp/painmap-symbol.svg; then
              if grep -q '#3154D8' /tmp/painmap-symbol.svg; then
                symbol_ok=true
              else
                echo "brand symbol marker not present"
              fi
            fi

            if $root_ok && $css_ok && $symbol_ok; then
              echo "PainMap Evidence Field brand is deployed and reachable."
              exit 0
            fi

            sleep 15
          done

          echo "Live PainMap did not expose the expected brand markers within the retry window."
          echo "Homepage preview:"
          sed -n '1,80p' /tmp/painmap-live.html 2>/dev/null || true
          exit 1
