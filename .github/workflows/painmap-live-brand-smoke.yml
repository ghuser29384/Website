name: PainMap live Evidence Contours smoke

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "brand.css"
      - "assets/brand/**"
      - "scripts/apply-brand-system.mjs"
      - ".github/workflows/painmap-live-brand-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: painmap-live-brand-smoke
  cancel-in-progress: true

jobs:
  live-brand-smoke:
    name: Verify deployed Evidence Contours brand
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Wait for and verify the live brand
        shell: bash
        env:
          CACHE_BUSTER: ${{ github.sha }}
        run: |
          set -u

          fetch_live() {
            local label="$1"
            local url="$2"
            local output="$3"
            local code
            code=$(curl -sS -L --compressed --max-time 30 \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36' \
              -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
              -H 'Cache-Control: no-cache' \
              -o "$output" -w '%{http_code}' "${url}?brand=${CACHE_BUSTER}" || true)
            echo "$label HTTP $code"
            test "$code" = "200"
          }

          for attempt in $(seq 1 20); do
            echo "Live brand check attempt ${attempt}/20"
            root_ok=false
            css_ok=false
            logo_ok=false

            if fetch_live "homepage" "https://painmap.org/" /tmp/painmap-live.html; then
              if grep -q 'data-brand="evidence-contours-v1"' /tmp/painmap-live.html \
                && grep -q 'What is known.' /tmp/painmap-live.html \
                && grep -q 'What is inferred.' /tmp/painmap-live.html \
                && grep -q 'What is missing.' /tmp/painmap-live.html; then
                root_ok=true
              else
                echo "homepage Evidence Contours markers not present"
              fi
            fi

            if fetch_live "brand.css" "https://painmap.org/brand.css" /tmp/painmap-brand.css; then
              if grep -qi -- '--pm-deep-teal: #174d55' /tmp/painmap-brand.css \
                && grep -q 'evidence-contours-v1' /tmp/painmap-brand.css; then
                css_ok=true
              else
                echo "brand.css Evidence Contours tokens not present"
              fi
            fi

            if fetch_live "primary logo" "https://painmap.org/assets/brand/painmap-logo-horizontal-primary.svg" /tmp/painmap-logo.svg; then
              if grep -qi '#174d55' /tmp/painmap-logo.svg \
                && grep -qi '#e65b43' /tmp/painmap-logo.svg; then
                logo_ok=true
              else
                echo "primary logo Evidence Contours markers not present"
              fi
            fi

            if $root_ok && $css_ok && $logo_ok; then
              echo "PainMap Evidence Contours is deployed and reachable."
              exit 0
            fi

            sleep 15
          done

          echo "Live PainMap did not expose the expected Evidence Contours markers within the retry window."
          echo "Homepage preview:"
          sed -n '1,100p' /tmp/painmap-live.html 2>/dev/null || true
          exit 1
