name: PainMap discover nonfatal pain data

on:
  issues:
    types:
      - opened
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  discover:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.title == '[PainMap Data] Discover nonfatal pain sources') ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.title == '[PainMap Data] Discover nonfatal pain sources' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Query official and publisher APIs
        id: discovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          terms = [
              'low back pain',
              'neck pain',
              'migraine',
              'headache disorders',
              'osteoarthritis',
              'rheumatoid arthritis',
              'musculoskeletal disorders',
              'chronic pain',
          ]

          def fetch_json(url, timeout=45):
              request = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': 'PainMap-data-discovery/1.0 (+https://painmaps.org)',
                      'Accept': 'application/json',
                  },
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  payload = response.read()
                  return {
                      'url': url,
                      'status': response.status,
                      'content_type': response.headers.get('content-type'),
                      'bytes': len(payload),
                      'json': json.loads(payload.decode('utf-8-sig')),
                  }

          output = {
              'generated_at': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
              'owid_search': {},
              'who_gho_indicator_search': {},
              'world_bank_indicator_metadata': {},
              'errors': [],
          }

          for term in terms:
              url = 'https://ourworldindata.org/api/search?' + urllib.parse.urlencode({
                  'q': term,
                  'type': 'charts',
                  'hitsPerPage': 50,
              })
              try:
                  result = fetch_json(url)
                  rows = result['json'].get('results', [])
                  output['owid_search'][term] = {
                      'url': url,
                      'status': result['status'],
                      'nb_hits': result['json'].get('nbHits'),
                      'results': [
                          {
                              'title': row.get('title'),
                              'subtitle': row.get('subtitle'),
                              'variant_name': row.get('variantName'),
                              'slug': row.get('slug'),
                              'url': row.get('url'),
                              'type': row.get('type'),
                              'available_entity_count': len(row.get('availableEntities') or []),
                              'updated_at': row.get('updatedAt'),
                          }
                          for row in rows[:25]
                      ],
                  }
              except Exception as exc:
                  output['errors'].append({'source': 'owid', 'term': term, 'error': repr(exc)})

          for term in terms:
              safe_term = term.replace("'", "''")
              query = f"contains(tolower(IndicatorName),'{safe_term.lower()}')"
              url = 'https://ghoapi.azureedge.net/api/Indicator?' + urllib.parse.urlencode({
                  '$filter': query,
                  '$top': 100,
              })
              try:
                  result = fetch_json(url)
                  rows = result['json'].get('value', [])
                  output['who_gho_indicator_search'][term] = {
                      'url': url,
                      'status': result['status'],
                      'results': [
                          {
                              'indicator_code': row.get('IndicatorCode'),
                              'indicator_name': row.get('IndicatorName'),
                              'language': row.get('Language'),
                          }
                          for row in rows
                      ],
                  }
              except Exception as exc:
                  output['errors'].append({'source': 'who_gho', 'term': term, 'error': repr(exc)})

          wb_codes = [
              'SH.STA.DIAB.ZS',
              'SH.TBS.INCD',
              'SH.MLR.INCD.P3',
              'SH.DYN.AIDS.ZS',
              'SH.STA.MMRT',
              'VC.IHR.PSRC.P5',
              'SN.ITK.DEFC.ZS',
              'EN.ATM.PM25.MC.M3',
          ]
          for code in wb_codes:
              url = f'https://api.worldbank.org/v2/indicator/{code}?format=json'
              try:
                  result = fetch_json(url)
                  payload = result['json']
                  rows = payload[1] if isinstance(payload, list) and len(payload) > 1 else []
                  output['world_bank_indicator_metadata'][code] = {
                      'url': url,
                      'status': result['status'],
                      'rows': rows,
                  }
              except Exception as exc:
                  output['errors'].append({'source': 'world_bank', 'indicator': code, 'error': repr(exc)})

          Path('pain-data-discovery.json').write_text(json.dumps(output, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          lines = [
              '## PainMap nonfatal-pain data discovery',
              '',
              f"- OWID search terms completed: {len(output['owid_search'])}/{len(terms)}",
              f"- WHO GHO search terms completed: {len(output['who_gho_indicator_search'])}/{len(terms)}",
              f"- World Bank indicator metadata records: {len(output['world_bank_indicator_metadata'])}/{len(wb_codes)}",
              f"- Retrieval errors: {len(output['errors'])}",
              '',
              '### OWID chart candidates',
          ]
          for term in terms:
              rows = output['owid_search'].get(term, {}).get('results', [])
              lines.append(f"- **{term}**: {len(rows)} returned")
              for row in rows[:5]:
                  lines.append(f"  - `{row.get('slug')}` — {row.get('title')} ({row.get('available_entity_count')} entities)")
          lines.extend(['', '### WHO GHO indicator candidates'])
          for term in terms:
              rows = output['who_gho_indicator_search'].get(term, {}).get('results', [])
              lines.append(f"- **{term}**: {len(rows)} returned")
              for row in rows[:5]:
                  lines.append(f"  - `{row.get('indicator_code')}` — {row.get('indicator_name')}")
          lines.extend(['', 'The full machine-readable discovery report is attached to the workflow run.'])
          Path('pain-data-discovery.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('summary<<EOF\n')
              stream.write(Path('pain-data-discovery.md').read_text(encoding='utf-8'))
              stream.write('EOF\n')
          PY

      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: pain-data-discovery
          path: |
            pain-data-discovery.json
            pain-data-discovery.md
          retention-days: 7

      - name: Report discovery
        if: github.event_name == 'issues' || github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        env:
          SUMMARY: ${{ steps.discovery.outputs.summary }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: process.env.SUMMARY
            });
            if (context.eventName === 'issues') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
