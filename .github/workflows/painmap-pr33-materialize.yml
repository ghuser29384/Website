name: PainMap PR 33 materializer

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: painmap-pr33-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.number == 33 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out exact PR branch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify isolated starting revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain=v1)"
          test "$(git merge-base HEAD 89e1fe89395ec8a4702b73bc3e89bf21b9870d44)" = "89e1fe89395ec8a4702b73bc3e89bf21b9870d44"

      - name: Materialize and validate twice
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run freshness:sources
          python3 -m py_compile clients/python/painmap_client.py examples/load_place_profile.py
          python3 -m py_compile scripts/build-source-backed-country-supplement.py scripts/build-human-health-pressure-context.py
          git diff --binary > /tmp/pr33-first.patch
          sha256sum /tmp/pr33-first.patch | tee /tmp/pr33-patch-sha256.txt
          npm run check
          git diff --binary > /tmp/pr33-second.patch
          cmp /tmp/pr33-first.patch /tmp/pr33-second.patch
          sha256sum /tmp/pr33-second.patch

      - name: Audit migration semantics
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < CNAME)" = "painmaps.org"
          npm run site-origin:check
          npm run html-assets:check
          git diff --check -- . ':(exclude)painmap2.md'
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import subprocess

          root = pathlib.Path.cwd()
          workflow_paths = {
              ".github/workflows/painmap-static-checks.yml",
              ".github/workflows/painmap-materialize-canonical-origin.yml",
              ".github/workflows/painmap-pr33-materialize.yml",
          }
          synchronized_workflows = workflow_paths - {".github/workflows/painmap-pr33-materialize.yml"}
          raw = subprocess.check_output(["git", "diff", "--name-only", "-z"])
          changed_all = [item.decode("utf-8") for item in raw.split(b"\0") if item]
          if len(changed_all) != 1073:
              raise SystemExit(f"unexpected all-changed-file count: {len(changed_all)}")
          if not synchronized_workflows.issubset(changed_all):
              raise SystemExit("expected synchronized workflow changes are missing")
          if ".github/workflows/painmap-pr33-materialize.yml" in changed_all:
              raise SystemExit("the PR materializer must not rewrite itself")
          changed = [path for path in changed_all if path not in synchronized_workflows]
          if len(changed) != 1071:
              raise SystemExit(f"unexpected generated changed-file count: {len(changed)}")

          json_paths = [path for path in changed if path.endswith((".json", ".jsonld", ".geojson"))]
          html_paths = [path for path in changed if path.endswith(".html")]
          json_set = set(json_paths)
          html_set = set(html_paths)
          other_paths = [path for path in changed if path not in json_set and path not in html_set]
          if (len(json_paths), len(html_paths), len(other_paths)) != (654, 388, 29):
              raise SystemExit(
                  f"unexpected generated classes: JSON={len(json_paths)}, HTML={len(html_paths)}, other={len(other_paths)}"
              )

          legacy_host = "painmap" + ".org"
          canonical_host = "painmaps" + ".org"

          def old_text(relative):
              return subprocess.check_output(["git", "show", f"HEAD:{relative}"]).decode("utf-8")

          def replace_hosts(value):
              return (
                  value.replace(legacy_host, canonical_host)
                  .replace(legacy_host.replace(".", "\\."), canonical_host.replace(".", "\\."))
                  .replace(legacy_host.replace(".", "\\\\."), canonical_host.replace(".", "\\\\."))
              )

          for relative in changed_all:
              try:
                  (root / relative).read_bytes().decode("utf-8")
              except UnicodeDecodeError as error:
                  raise SystemExit(f"non-UTF-8 generated change: {relative}: {error}")

          for relative in sorted(synchronized_workflows):
              if replace_hosts(old_text(relative)) != (root / relative).read_text(encoding="utf-8"):
                  raise SystemExit(f"temporary workflow changed beyond host synchronization: {relative}")

          allowed_byte_fields = {"bytes", "byte_count", "size", "size_bytes"}
          hex64 = re.compile(r"[0-9a-f]{64}")

          def audit_json(before, after, location):
              if type(before) is not type(after):
                  raise SystemExit(f"JSON type changed at {location}")
              if isinstance(before, dict):
                  if before.keys() != after.keys():
                      raise SystemExit(f"JSON keys changed at {location}")
                  for key in before:
                      audit_json(before[key], after[key], location + (key,))
                  return
              if isinstance(before, list):
                  if len(before) != len(after):
                      raise SystemExit(f"JSON length changed at {location}")
                  for index, pair in enumerate(zip(before, after)):
                      audit_json(pair[0], pair[1], location + (index,))
                  return
              if before == after:
                  return
              leaf = str(location[-1])
              if isinstance(before, str) and isinstance(after, str):
                  if replace_hosts(before) == after:
                      return
                  if hex64.fullmatch(before) and hex64.fullmatch(after):
                      return
              if (
                  isinstance(before, (int, float))
                  and not isinstance(before, bool)
                  and isinstance(after, (int, float))
                  and not isinstance(after, bool)
                  and leaf in allowed_byte_fields
              ):
                  return
              raise SystemExit(f"unapproved JSON scalar change at {location}: {before!r} -> {after!r}")

          for relative in json_paths:
              audit_json(
                  json.loads(old_text(relative)),
                  json.loads((root / relative).read_text(encoding="utf-8")),
                  (relative,),
              )

          body_pattern = re.compile(r"<body\b[\s\S]*?</body>", re.IGNORECASE)
          asset_names = ("script.js", "compare.js", "places-coverage.js", "route-table-labels.js")

          def normalized_body(value, relative):
              match = body_pattern.search(replace_hosts(value))
              if not match:
                  raise SystemExit(f"missing body element: {relative}")
              body = match.group(0)
              for asset in asset_names:
                  body = re.sub(
                      rf'(\bsrc="(?:/|\.\.?/)*{re.escape(asset)})(?:\?[^\"]*)?(\")',
                      r"\1\2",
                      body,
                      flags=re.IGNORECASE,
                  )
              body = re.sub(r'\s+integrity="[^"]*"', "", body, flags=re.IGNORECASE)
              body = re.sub(r'\s+crossorigin="anonymous"', "", body, flags=re.IGNORECASE)
              return body

          for relative in html_paths:
              if normalized_body(old_text(relative), relative) != normalized_body(
                  (root / relative).read_text(encoding="utf-8"), relative
              ):
                  raise SystemExit(f"HTML body changed outside host and asset metadata: {relative}")

          for relative in other_paths:
              if replace_hosts(old_text(relative)) != (root / relative).read_text(encoding="utf-8"):
                  raise SystemExit(f"non-HTML text changed beyond host replacement: {relative}")

          summary = {
              "all_changed_files": 1073,
              "generated_changed_files": 1071,
              "temporary_workflow_files": 2,
              "json_files": 654,
              "html_files": 388,
              "other_text_files": 29,
              "numeric_measurement_changes": 0,
              "evidence_or_ranking_semantic_changes": 0,
          }
          pathlib.Path("/tmp/pr33-semantic-audit.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Smoke test materialized endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/painmap-static-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          npm run smoke:endpoints

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr33-materialization-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/pr33-first.patch
            /tmp/pr33-patch-sha256.txt
            /tmp/pr33-semantic-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated outputs without workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- \
            .github/workflows/painmap-static-checks.yml \
            .github/workflows/painmap-materialize-canonical-origin.yml \
            .github/workflows/painmap-pr33-materialize.yml
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1071"
          if git diff --name-only | grep -q '^\.github/workflows/'; then
            echo "Workflow changes remain in the materialized commit." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize painmaps.org canonical origin"
          npm run check
          git restore --source=HEAD -- \
            .github/workflows/painmap-static-checks.yml \
            .github/workflows/painmap-materialize-canonical-origin.yml \
            .github/workflows/painmap-pr33-materialize.yml
          git diff --exit-code
          git fetch origin fix/canonical-domain-painmaps-org-20260731
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git push origin HEAD:fix/canonical-domain-painmaps-org-20260731
