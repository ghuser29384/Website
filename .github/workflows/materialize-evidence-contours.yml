name: Materialize PainMap Evidence Contours

on:
  push:
    branches:
      - brand/evidence-contours-v1-final
    paths:
      - data/evidence-contours-materialize-trigger.json
      - .github/workflows/materialize-evidence-contours.yml
  pull_request:
    branches:
      - main
    paths:
      - brand.css
      - assets/brand/**
      - scripts/apply-brand-system.mjs
      - data/evidence-contours-materialize-trigger.json
      - .github/workflows/materialize-evidence-contours.yml

permissions:
  contents: write

concurrency:
  group: painmap-evidence-contours-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: brand/evidence-contours-v1-final
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize brand and validate repository contracts
        shell: bash
        run: |
          set +e
          node --check scripts/apply-brand-system.mjs > /tmp/node-check.log 2>&1
          node_status=$?
          npm run check > /tmp/npm-check.log 2>&1
          check_status=$?
          npm run freshness:sources > /tmp/freshness.log 2>&1
          freshness_status=$?
          git diff --check > /tmp/diff-check.log 2>&1
          diff_status=$?

          echo "=== node --check (status ${node_status}) ==="
          tail -n 80 /tmp/node-check.log
          echo "=== npm run check (status ${check_status}) ==="
          tail -n 180 /tmp/npm-check.log
          echo "=== freshness (status ${freshness_status}) ==="
          tail -n 80 /tmp/freshness.log
          echo "=== git diff --check (status ${diff_status}) ==="
          tail -n 80 /tmp/diff-check.log

          grep -q 'data-brand="evidence-contours-v1"' index.html
          brand_attr_status=$?
          grep -q 'What is known\.' index.html
          hero_status=$?
          grep -q 'Mixed-evidence atlas of pain sources by place' index.html
          descriptor_status=$?
          grep -q 'painmap-logo-horizontal-primary.svg' index.html
          logo_status=$?
          test -f assets/brand/evidence-contours-hero.svg
          asset_status=$?
          echo "brand_attr=${brand_attr_status} hero=${hero_status} descriptor=${descriptor_status} logo=${logo_status} asset=${asset_status}"

          if [ "$node_status" -ne 0 ] || [ "$check_status" -ne 0 ] || [ "$freshness_status" -ne 0 ] || [ "$diff_status" -ne 0 ] || [ "$brand_attr_status" -ne 0 ] || [ "$hero_status" -ne 0 ] || [ "$descriptor_status" -ne 0 ] || [ "$logo_status" -ne 0 ] || [ "$asset_status" -ne 0 ]; then
            exit 1
          fi

      - name: Run endpoint smoke checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/painmap-brand-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          sleep 2
          npm run smoke:endpoints

      - name: Commit materialized routes and release hashes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Evidence Contours output is already materialized."
            exit 0
          fi
          git commit -m "Materialize PainMap Evidence Contours across static routes"
          git push origin HEAD:brand/evidence-contours-v1-final
