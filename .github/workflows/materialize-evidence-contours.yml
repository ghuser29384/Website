name: Materialize PainMap Evidence Contours

on:
  push:
    branches:
      - brand/evidence-contours-v1-final
    paths:
      - data/evidence-contours-materialize-trigger.json
      - .github/workflows/materialize-evidence-contours.yml
  pull_request:
    branches:
      - main
    paths:
      - brand.css
      - assets/brand/**
      - scripts/apply-brand-system.mjs
      - data/evidence-contours-materialize-trigger.json
      - .github/workflows/materialize-evidence-contours.yml

permissions:
  contents: write

concurrency:
  group: painmap-evidence-contours-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: brand/evidence-contours-v1-final
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect materialization diagnostics
        id: diagnostics
        shell: bash
        run: |
          set +e
          node --check scripts/apply-brand-system.mjs > /tmp/node-check.log 2>&1
          node_status=$?
          npm run check > /tmp/npm-check.log 2>&1
          check_status=$?
          npm run freshness:sources > /tmp/freshness.log 2>&1
          freshness_status=$?
          git diff --check > /tmp/diff-check.log 2>&1
          diff_status=$?

          grep -q 'data-brand="evidence-contours-v1"' index.html
          brand_attr_status=$?
          grep -q 'What is known\.' index.html
          hero_status=$?
          grep -q 'Mixed-evidence atlas of pain sources by place' index.html
          descriptor_status=$?
          grep -q 'painmap-logo-horizontal-primary.svg' index.html
          logo_status=$?
          test -f assets/brand/evidence-contours-hero.svg
          asset_status=$?

          {
            echo "Evidence Contours validation diagnostics"
            echo "node_status=${node_status}"
            echo "check_status=${check_status}"
            echo "freshness_status=${freshness_status}"
            echo "diff_status=${diff_status}"
            echo "brand_attr_status=${brand_attr_status}"
            echo "hero_status=${hero_status}"
            echo "descriptor_status=${descriptor_status}"
            echo "logo_status=${logo_status}"
            echo "asset_status=${asset_status}"
            echo
            echo "=== node --check ==="
            cat /tmp/node-check.log
            echo
            echo "=== npm run check ==="
            tail -n 300 /tmp/npm-check.log
            echo
            echo "=== freshness ==="
            tail -n 160 /tmp/freshness.log
            echo
            echo "=== git diff --check ==="
            cat /tmp/diff-check.log
          } > data/evidence-contours-diagnostics.txt

          {
            echo "node_status=${node_status}"
            echo "check_status=${check_status}"
            echo "freshness_status=${freshness_status}"
            echo "diff_status=${diff_status}"
            echo "brand_attr_status=${brand_attr_status}"
            echo "hero_status=${hero_status}"
            echo "descriptor_status=${descriptor_status}"
            echo "logo_status=${logo_status}"
            echo "asset_status=${asset_status}"
          } > data/evidence-contours-status.env

      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evidence-contours-diagnostics.txt data/evidence-contours-status.env
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Evidence Contours validation diagnostics"
          git push origin HEAD:brand/evidence-contours-v1-final

      - name: Fail when validation failed
        shell: bash
        run: |
          set -euo pipefail
          source data/evidence-contours-status.env
          for value in "$node_status" "$check_status" "$freshness_status" "$diff_status" "$brand_attr_status" "$hero_status" "$descriptor_status" "$logo_status" "$asset_status"; do
            test "$value" -eq 0
          done

      - name: Run endpoint smoke checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/painmap-brand-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          sleep 2
          npm run smoke:endpoints

      - name: Commit materialized routes and release hashes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Evidence Contours output is already materialized."
            exit 0
          fi
          git commit -m "Materialize PainMap Evidence Contours across static routes"
          git push origin HEAD:brand/evidence-contours-v1-final
