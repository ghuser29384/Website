name: Codex export branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    name: Export branch snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out proposed branch
        uses: actions/checkout@v4
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: painmaps-branch-snapshot
          path: .
          include-hidden-files: true
          retention-days: 1
