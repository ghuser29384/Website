name: PainMap materialize canonical origin

on:
  push:
    branches:
      - fix/canonical-domain-painmaps-org-20260731

permissions:
  contents: write

concurrency:
  group: painmap-materialize-canonical-origin
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out canonical-origin branch
        uses: actions/checkout@v4
        with:
          ref: fix/canonical-domain-painmaps-org-20260731
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize and validate the complete site
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run freshness:sources
          python3 -m py_compile \
            clients/python/painmap_client.py \
            examples/load_place_profile.py \
            scripts/build-source-backed-country-supplement.py \
            scripts/build-human-health-pressure-context.py
          git diff --check

      - name: Verify canonical-host migration boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < CNAME)" = "painmaps.org"
          npm run site-origin:check
          if git diff --numstat | awk '$1 == "-" || $2 == "-" { found=1 } END { exit found ? 0 : 1 }'; then
            echo "Binary changes are not permitted in the canonical-host migration." >&2
            exit 1
          fi
          changed_count="$(git diff --name-only | wc -l | tr -d ' ')"
          if [[ "$changed_count" -lt 10 || "$changed_count" -gt 5000 ]]; then
            echo "Unexpected canonical-host migration scope: $changed_count files." >&2
            exit 1
          fi
          echo "Canonical-host migration changed $changed_count tracked files."
          git diff --stat

      - name: Commit exact validated migration and retire this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/painmap-materialize-canonical-origin.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Canonicalize public metadata on painmaps.org"
          git push origin HEAD:fix/canonical-domain-painmaps-org-20260731
