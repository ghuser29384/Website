name: PainMap materialize route inventories

on:
  push:
    branches:
      - fix/route-inventory-sync-20260731

permissions:
  contents: write

concurrency:
  group: painmap-materialize-route-inventories
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/route-inventory-sync-20260731
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and validate route inventories
        run: npm run check

      - name: Reject unrelated generated changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | tee /tmp/painmap-generated-files.txt
          unexpected="$(grep -Ev '^(data/route-smoke\.json|latest/manifest\.json|releases/2026-05-31/manifest\.json)$' /tmp/painmap-generated-files.txt || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected generated files:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          expected_count="$(wc -l < /tmp/painmap-generated-files.txt | tr -d ' ')"
          if [[ "$expected_count" != "3" ]]; then
            echo "Expected exactly three generated files, found $expected_count" >&2
            exit 1
          fi

      - name: Commit exact generated outputs and retire this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/painmap-materialize-route-inventories.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/route-smoke.json latest/manifest.json releases/2026-05-31/manifest.json .github/workflows/painmap-materialize-route-inventories.yml
          git commit -m "Materialize synchronized route inventories"
          git push origin HEAD:fix/route-inventory-sync-20260731
