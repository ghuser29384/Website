name: One-time map timeout repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-map-timeouts.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch loader and refresh asset metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import datetime as dt
          import hashlib
          import json
          import re

          script_path = Path("script.js")
          script = script_path.read_text(encoding="utf-8")

          replacements = {
              "data = await fetchJson(COUNTRY_DATA_URL, 1800);":
                  "data = await fetchJson(COUNTRY_DATA_URL, 30000);",
              "data = await fetchJson(COUNTRY_DATA_FALLBACK_URL, 3000);":
                  "data = await fetchJson(COUNTRY_DATA_FALLBACK_URL, 30000);",
          }

          for old, new in replacements.items():
              count = script.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old!r}, found {count}")
              script = script.replace(old, new)

          script_path.write_text(script, encoding="utf-8")
          script_bytes = script_path.read_bytes()
          fingerprint = hashlib.sha256(script_bytes).hexdigest()[:16]
          integrity = "sha384-" + base64.b64encode(hashlib.sha384(script_bytes).digest()).decode("ascii")

          tag_pattern = re.compile(r"<(?:script|link)\b[^>]*>", re.IGNORECASE)
          version_pattern = re.compile(r"(?P<prefix>(?:/|\.\./)*script\.js\?v=)[^\"']+")
          integrity_pattern = re.compile(r"integrity=([\"'])sha384-[^\"']+\1")

          changed_html = []
          for html_path in Path(".").rglob("*.html"):
              original = html_path.read_text(encoding="utf-8")

              def rewrite_tag(match):
                  tag = match.group(0)
                  if "script.js?v=" not in tag:
                      return tag
                  tag = version_pattern.sub(lambda m: f"{m.group('prefix')}{fingerprint}", tag)
                  if "integrity=" in tag:
                      tag = integrity_pattern.sub(f'integrity="{integrity}"', tag)
                  return tag

              updated = tag_pattern.sub(rewrite_tag, original)
              if updated != original:
                  html_path.write_text(updated, encoding="utf-8")
                  changed_html.append(str(html_path))

          service_worker_path = Path("service-worker.js")
          service_worker = service_worker_path.read_text(encoding="utf-8")
          updated_service_worker, count = re.subn(
              r'const CACHE_VERSION = "painmap-service-worker-v\d+";',
              'const CACHE_VERSION = "painmap-service-worker-v5";',
              service_worker,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update service-worker cache version")
          service_worker_path.write_text(updated_service_worker, encoding="utf-8")

          marker = {
              "fixed_at": dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat(),
              "reason": "Prevent country-boundary requests from failing on cold or slow static-asset loads.",
              "primary_timeout_ms": 30000,
              "fallback_timeout_ms": 30000,
              "script_fingerprint": fingerprint,
              "script_integrity": integrity,
              "html_files_refreshed": len(changed_html),
          }
          Path("data/map-loader-fix.json").write_text(
              json.dumps(marker, indent=2) + "\n",
              encoding="utf-8",
          )

          print(json.dumps(marker, indent=2))
          PY

      - name: Validate repaired site
        shell: bash
        run: |
          node --check script.js
          node scripts/check-static-site.mjs
          npm run smoke:ui
          grep -F 'fetchJson(COUNTRY_DATA_URL, 30000)' script.js
          grep -F 'fetchJson(COUNTRY_DATA_FALLBACK_URL, 30000)' script.js

      - name: Commit repaired loader
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-map-timeouts.yml
          git add -A
          git commit -m "Fix cold-load country boundary timeouts"
          git push origin HEAD:main

# Triggered after the workflow was present on the default branch.
