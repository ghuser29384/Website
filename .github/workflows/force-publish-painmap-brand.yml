name: Force publish PainMap Evidence Contours brand

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/force-publish-painmap-brand.yml"
      - "data/force-brand-release-trigger.json"

permissions:
  contents: write

concurrency:
  group: painmap-force-brand-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply Evidence Contours brand
        run: |
          node scripts/apply-brand-system.mjs
          grep -q "What is known\." index.html
          grep -q 'data-brand="evidence-contours-v1"' index.html
          grep -q "painmap-logo-horizontal-primary.svg" index.html
      - name: Commit generated branded routes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Brand output is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish PainMap Evidence Contours brand across static routes"
          git push origin HEAD:main
