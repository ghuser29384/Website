name: Codex deploy PainMap data to production

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/codex-live-data-deploy.yml

permissions:
  contents: write

concurrency:
  group: codex-live-data-deploy
  cancel-in-progress: false

jobs:
  merge-refresh-validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge validated data branch into current production tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin codex/add-source-backed-country-data
          git merge --no-commit --no-ff origin/codex/add-source-backed-country-data || true

          conflicts="$(git diff --name-only --diff-filter=U)"
          unknown="$(printf '%s\n' "$conflicts" | grep -Ev '^(data/index\.html|package\.json|data/country-gap-ledger\.json|data/source-snapshots\.json|latest/manifest\.json)$' || true)"
          if [ -n "$unknown" ]; then
            echo "Unexpected merge conflicts:" >&2
            printf '%s\n' "$unknown" >&2
            exit 1
          fi

          for path in data/index.html package.json data/country-gap-ledger.json data/source-snapshots.json latest/manifest.json; do
            if printf '%s\n' "$conflicts" | grep -Fxq "$path"; then
              git checkout --ours -- "$path"
              git add "$path"
            fi
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('package.json')
          package = json.loads(path.read_text(encoding='utf-8'))
          scripts = package.setdefault('scripts', {})
          scripts['candidate:data:refresh'] = 'python3 scripts/build-source-backed-country-supplement.py --refresh'
          scripts['candidate:data:check'] = 'python3 scripts/build-source-backed-country-supplement.py --check'
          check = scripts.get('check', '')
          if 'candidate:data:check' not in check:
              check = check.replace('npm run build:data', 'npm run build:data && npm run candidate:data:check', 1)
          scripts['check'] = check
          path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')
          PY
          git add package.json

          rm -f .github/workflows/codex-merge-current-main.yml

          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

      - name: Refresh source-backed pain-driver data
        run: npm run candidate:data:refresh

      - name: Validate production release contract
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run freshness:sources
          python3 -m py_compile clients/python/painmap_client.py examples/load_place_profile.py scripts/build-source-backed-country-supplement.py
          git diff --check

      - name: Smoke test all public endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/painmap-static-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null || {
            cat /tmp/painmap-static-server.log
            exit 1
          }
          npm run smoke:endpoints || {
            status=$?
            cat /tmp/painmap-static-server.log
            exit "$status"
          }

      - name: Commit validated data directly to production
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/codex-live-data-deploy.yml
          git add -A
          git status --short
          git commit -m 'Deploy global pain-driver context data'
          git push origin HEAD:main

      - name: Upload production QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: painmap-production-data-qa
          path: |
            data/pain-driver-context.json
            data/pain-driver-context.csv
            schemas/pain-driver-context.schema.json
            data/candidates/country-data-expansion/source-backed-country-summary.json
            data/candidates/country-data-expansion/validation-summary.json
            data/candidates/country-data-expansion/source-extracts/
          if-no-files-found: ignore
          retention-days: 7
