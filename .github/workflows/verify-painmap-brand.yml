name: Verify PainMap Evidence Contours deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-painmap-brand.yml"
      - "data/brand-validation-trigger.json"

permissions:
  contents: write

concurrency:
  group: painmap-brand-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm generated brand output
        run: |
          grep -q "What is known\." index.html
          grep -q "What is inferred\." index.html
          grep -q "What is missing\." index.html
          grep -q 'data-brand="evidence-contours-v1"' index.html
          grep -q "brand.css" index.html
          grep -q "painmap-logo-horizontal-primary.svg" index.html
          test -f assets/brand/painmap-logo-horizontal-primary.svg
          test -f assets/brand/painmap-symbol-primary.svg
          test -f assets/brand/painmap-favicon.svg
          test -f assets/brand/evidence-contours-hero.svg
          test -f assets/brand/painmap-social-card.svg
      - name: Run production validation
        run: |
          node scripts/check-static-site.mjs
          npm run validate:release
          npm run smoke:ui
          npm run fixtures:check
          npm run freshness:sources
          git diff --check
      - name: Record verified deployment state
        shell: bash
        run: |
          cat > data/brand-deployment-status.json <<JSON
          {
            "brand_system": "PainMap Brand System v1.0 — Evidence Contours",
            "brand_id": "evidence-contours-v1",
            "verified": true,
            "verified_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "source_commit": "${GITHUB_SHA}",
            "checks": [
              "generated brand output",
              "static site contract",
              "release contract",
              "UI and accessibility smoke",
              "fixture validation",
              "source freshness",
              "git diff whitespace"
            ]
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/brand-deployment-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record verified PainMap Evidence Contours deployment"
          git push origin HEAD:main
