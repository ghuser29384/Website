name: PainMap static checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    name: Static release contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate generated static contract
        run: npm run check

      - name: Check source freshness contract
        run: npm run freshness:sources

      - name: Record first materialized diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary > /tmp/painmap-materialized-first.patch
          sha256sum /tmp/painmap-materialized-first.patch

      - name: Prove generator idempotence
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          git diff --binary > /tmp/painmap-materialized-second.patch
          cmp /tmp/painmap-materialized-first.patch /tmp/painmap-materialized-second.patch
          sha256sum /tmp/painmap-materialized-second.patch

      - name: Compile Python examples and client
        run: python3 -m py_compile clients/python/painmap_client.py examples/load_place_profile.py

      - name: Compile Python builders
        run: python3 -m py_compile scripts/build-source-backed-country-supplement.py scripts/build-human-health-pressure-context.py

      - name: Verify canonical-host migration boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < CNAME)" = "painmaps.org"
          npm run site-origin:check
          npm run html-assets:check
          if git diff --numstat | awk '$1 == "-" || $2 == "-" { found=1 } END { exit found ? 0 : 1 }'; then
            echo "Binary changes are not permitted in the canonical-host migration." >&2
            exit 1
          fi
          changed_count="$(git diff --name-only | wc -l | tr -d ' ')"
          if [[ "$changed_count" -lt 10 || "$changed_count" -gt 5000 ]]; then
            echo "Unexpected canonical-host migration scope: $changed_count files." >&2
            exit 1
          fi
          echo "Canonical-host migration changed $changed_count tracked files."
          git diff --stat

      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/painmap-static-server.log 2>&1 &
          echo "$!" > /tmp/painmap-static-server.pid

      - name: Smoke test static endpoints
        run: npm run smoke:endpoints

      - name: Package materialized worktree for independent review
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr33-materialization
          git status --short --branch > /tmp/pr33-materialization/git-status.txt
          git diff --stat > /tmp/pr33-materialization/diff-stat.txt
          git diff --name-status > /tmp/pr33-materialization/name-status.txt
          git diff --numstat > /tmp/pr33-materialization/numstat.txt
          git diff --binary > /tmp/pr33-materialization/materialized.patch
          git diff --check > /tmp/pr33-materialization/diff-check.txt 2>&1 || true
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess
          import tarfile

          root = pathlib.Path.cwd()
          output = pathlib.Path('/tmp/pr33-materialization')
          changed_raw = subprocess.check_output(['git', 'diff', '--name-only', '-z'])
          changed_paths = [item.decode('utf-8') for item in changed_raw.split(b'\0') if item]
          tracked_raw = subprocess.check_output(['git', 'ls-files', '-z'])
          tracked_paths = [item.decode('utf-8') for item in tracked_raw.split(b'\0') if item]
          manifest = []
          with tarfile.open(output / 'materialized-files.tar.gz', 'w:gz') as archive:
              for relative in changed_paths:
                  target = root / relative
                  if not target.is_file():
                      manifest.append({'path': relative, 'state': 'not-a-regular-file'})
                      continue
                  data = target.read_bytes()
                  manifest.append({
                      'path': relative,
                      'bytes': len(data),
                      'sha256': hashlib.sha256(data).hexdigest(),
                  })
                  archive.add(target, arcname=relative, recursive=False)
          with tarfile.open(output / 'full-tracked-worktree.tar.gz', 'w:gz') as archive:
              for relative in tracked_paths:
                  target = root / relative
                  if target.is_file():
                      archive.add(target, arcname=relative, recursive=False)
          (output / 'manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          patch = (output / 'materialized.patch').read_bytes()
          (output / 'patch-sha256.txt').write_text(
              hashlib.sha256(patch).hexdigest() + '\n',
              encoding='ascii',
          )
          PY

      - name: Upload materialized worktree review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr33-materialized-worktree
          path: /tmp/pr33-materialization
          if-no-files-found: error
          retention-days: 7

      - name: Fail on generated artifact drift
        run: git diff --exit-code

      - name: Stop local static server
        if: always()
        run: |
          if [ -f /tmp/painmap-static-server.pid ]; then
            kill "$(cat /tmp/painmap-static-server.pid)" || true
          fi
