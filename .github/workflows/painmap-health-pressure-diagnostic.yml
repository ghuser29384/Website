name: PainMap diagnose human health-pressure context

on:
  issues:
    types:
      - opened
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.title == '[PainMap Data] Diagnose human health-pressure context'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run full publication preparation and capture diagnostics
        id: diagnostic
        shell: bash
        run: |
          set +e
          : > diagnostic.log
          phase=refresh
          python3 scripts/build-human-health-pressure-context.py --refresh >> diagnostic.log 2>&1
          status=$?

          if [ "$status" -eq 0 ]; then
            phase=static-check
            npm run check >> diagnostic.log 2>&1
            status=$?
          fi

          if [ "$status" -eq 0 ]; then
            phase=source-freshness
            npm run freshness:sources >> diagnostic.log 2>&1
            status=$?
          fi

          if [ "$status" -eq 0 ]; then
            phase=python-compile
            python3 -m py_compile \
              clients/python/painmap_client.py \
              examples/load_place_profile.py \
              scripts/build-source-backed-country-supplement.py \
              scripts/build-human-health-pressure-context.py >> diagnostic.log 2>&1
            status=$?
          fi

          if [ "$status" -eq 0 ]; then
            phase=diff-check
            git diff --check >> diagnostic.log 2>&1
            status=$?
          fi

          {
            echo
            echo "FINAL_PHASE=$phase"
            echo "FINAL_STATUS=$status"
          } >> diagnostic.log
          cat diagnostic.log
          {
            echo "status=$status"
            echo "phase=$phase"
            echo "log<<EOF"
            tail -n 240 diagnostic.log
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: painmap-health-pressure-diagnostic
          path: diagnostic.log
          retention-days: 7

      - name: Report diagnostic result
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          STATUS: ${{ steps.diagnostic.outputs.status }}
          PHASE: ${{ steps.diagnostic.outputs.phase }}
          LOG: ${{ steps.diagnostic.outputs.log }}
        with:
          script: |
            const body = [
              '## PainMap health-pressure publication diagnostic',
              '',
              `- Final phase: **${process.env.PHASE || 'unknown'}**`,
              `- Exit status: \`${process.env.STATUS || 'unknown'}\``,
              '',
              '```text',
              (process.env.LOG || 'No diagnostic output').slice(-18000),
              '```'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
